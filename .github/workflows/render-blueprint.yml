name: Render Blueprint Validation

on:
  pull_request:
    paths:
      - render.yaml
      - .github/workflows/render-blueprint.yml
  push:
    branches: [main]
    paths:
      - render.yaml
      - .github/workflows/render-blueprint.yml

jobs:
  validate-render-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Render CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/cli/main/bin/install.sh | sh
          echo "$HOME/.render/bin" >> "$GITHUB_PATH"
      - name: Validate render.yaml
        run: render blueprints validate render.yaml
