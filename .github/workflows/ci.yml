name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
env:
  MAVEN_ARGS: -B -ntp
jobs:
  build-and-test:
    name: Build, test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Compile all modules
        run: mvn $MAVEN_ARGS clean compile
      - name: Unit tests
        run: mvn $MAVEN_ARGS test
      - name: Integration tests (Testcontainers)
        run: mvn $MAVEN_ARGS verify -DskipUnitTests=false
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'false'
      - name: Package
        run: mvn $MAVEN_ARGS package -DskipTests
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7
  security-scan:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: OWASP dependency check
        run: >
          mvn $MAVEN_ARGS org.owasp:dependency-check-maven:10.0.4:check
          -DfailBuildOnCVSS=7
          -DskipProvidedScope=true
          -Dformats=HTML,JSON
        continue-on-error: true
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.*'
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker-build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - merchant-service
          - payment-service
          - provider-service
          - ledger-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          tags: payflow/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
  migration-check:
    name: Flyway migration safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject edits to existing migrations
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          CHANGED=$(git diff --diff-filter=M --name-only "$BASE" HEAD -- '*/db/migration/*.sql' || true)
          if [ -n "$CHANGED" ]; then
            echo "::error::These applied migrations were modified. Add a new versioned migration instead:"
            echo "$CHANGED"
            exit 1
          fi
          echo "No existing migrations were modified."
