server:
  port: 8085
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 256KB
    threads:
      max: 200
  error:
    include-stacktrace: never
    include-message: never
spring:
  application:
    name: payment-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:payment_db}
    username: ${POSTGRES_USER:payflow}
    password: ${POSTGRES_PASSWORD:payflow}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 3000
      leak-detection-threshold: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 300000
    listener:
      ack-mode: record
      missing-topics-fatal: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
payflow:
  jwt:
    secret: ${JWT_SECRET}
    issuer: payflow-auth
  internal:
    token: ${PAYFLOW_INTERNAL_TOKEN}
    response-timeout-ms: 3000
    connect-timeout-ms: 1000
  services:
    merchant-url: ${MERCHANT_SERVICE_URL:http://localhost:8082}
    provider-url: ${PROVIDER_SERVICE_URL:http://localhost:8086}
    risk-url: ${RISK_SERVICE_URL:http://localhost:8093}
  risk:
    fail-open-ceiling: 5000.00
  outbox:
    enabled: true
    batch-size: 200
    poll-interval-ms: 500
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 3s
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
    instances:
      merchantService:
        baseConfig: default
      providerService:
        baseConfig: default
        waitDurationInOpenState: 30s
        slowCallDurationThreshold: 6s
      riskService:
        baseConfig: default
        waitDurationInOpenState: 10s
        slowCallDurationThreshold: 1500ms
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 40
        maxWaitDuration: 100ms
    instances:
      providerService:
        baseConfig: default
      riskService:
        maxConcurrentCalls: 60
        maxWaitDuration: 50ms
  retry:
    instances:
      merchantService:
        maxAttempts: 3
        waitDuration: 200ms
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,outbox
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 0.1
springdoc:
  swagger-ui:
    path: /swagger-ui.html
