groups:
  - name: payflow-payments
    rules:
      - alert: PaymentFailureRateHigh
        expr: |
          sum(rate(payflow_payment_failed_total[5m]))
            /
          clamp_min(sum(rate(payflow_payment_created_total[5m])), 0.001) > 0.1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "More than 10% of payments are failing"
      - alert: OutboxBacklogGrowing
        expr: payflow_outbox_pending > 500
        for: 3m
        labels: { severity: warning }
        annotations:
          summary: "Transactional outbox is not draining - Kafka may be down"
      - alert: LedgerUnbalancedPostingRejected
        expr: increase(payflow_ledger_unbalanced_total[10m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "A ledger posting was rejected as unbalanced - investigate immediately"
      - alert: ProviderCircuitOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Circuit breaker {{ $labels.name }} is OPEN"
