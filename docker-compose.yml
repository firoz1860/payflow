name: payflow
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [payflow]
  # Give each JVM a hard ceiling. MaxRAMPercentage is only meaningful when the
  # container itself is bounded - otherwise every JVM sizes its heap against the
  # whole host and the eleventh container gets OOM-killed.
  mem_limit: 512m
  environment: &common-env
    SPRING_PROFILES_ACTIVE: docker
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    PAYFLOW_INTERNAL_TOKEN: ${PAYFLOW_INTERNAL_TOKEN}
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=140m -XX:TieredStopAtLevel=1 -Dspring.jmx.enabled=false"
services:
  postgres:
    image: postgres:16-alpine
    container_name: payflow-postgres
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [payflow]
  redis:
    image: redis:7-alpine
    container_name: payflow-redis
    ports: ["6381:6379"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [payflow]
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: payflow-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      # KRaft requires a base64-encoded UUID, not an arbitrary descriptive string.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [payflow]
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: payflow-kafka-ui
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: payflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka: { condition: service_healthy }
    networks: [payflow]
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: payflow-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./infrastructure/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    networks: [payflow]
  grafana:
    image: grafana/grafana:11.2.0
    container_name: payflow-grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [payflow]
  api-gateway:
    <<: *service-defaults
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    container_name: payflow-api-gateway
    ports: ["8000:8080"]
    environment:
      <<: *common-env
      JWT_PUBLIC_SECRET: ${JWT_SECRET}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8081
      MERCHANT_SERVICE_URL: http://merchant-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      REFUND_SERVICE_URL: http://refund-service:8087
      SETTLEMENT_SERVICE_URL: http://settlement-service:8089
      WEBHOOK_SERVICE_URL: http://webhook-service:8091
      PAYFLOW_CORS_ORIGINS: ${PAYFLOW_CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
  auth-service:
    <<: *service-defaults
    build: { context: ., dockerfile: auth-service/Dockerfile }
    container_name: payflow-auth-service
    ports: ["8081:8081"]
    environment:
      <<: *common-env
      POSTGRES_DB: auth_db
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MERCHANT_SERVICE_URL: http://merchant-service:8082
      PAYFLOW_ADMIN_EMAIL: ${PAYFLOW_ADMIN_EMAIL:-}
      PAYFLOW_ADMIN_PASSWORD: ${PAYFLOW_ADMIN_PASSWORD:-}
      PAYFLOW_AUTO_VERIFY_EMAIL: ${PAYFLOW_AUTO_VERIFY_EMAIL:-true}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
  merchant-service:
    <<: *service-defaults
    build: { context: ., dockerfile: merchant-service/Dockerfile }
    container_name: payflow-merchant-service
    ports: ["8082:8082"]
    environment:
      <<: *common-env
      POSTGRES_DB: merchant_db
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      API_KEY_PEPPER: ${API_KEY_PEPPER}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
  payment-service:
    <<: *service-defaults
    build: { context: ., dockerfile: payment-service/Dockerfile }
    container_name: payflow-payment-service
    ports: ["8085:8085"]
    environment:
      <<: *common-env
      POSTGRES_DB: payment_db
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MERCHANT_SERVICE_URL: http://merchant-service:8082
      PROVIDER_SERVICE_URL: http://provider-service:8086
      RISK_SERVICE_URL: http://risk-service:8093
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      merchant-service: { condition: service_healthy }
      provider-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
  provider-service:
    <<: *service-defaults
    build: { context: ., dockerfile: provider-service/Dockerfile }
    container_name: payflow-provider-service
    ports: ["8086:8086"]
    environment:
      <<: *common-env
      POSTGRES_DB: provider_db
      PAYFLOW_PROVIDER_DEFAULT: sandbox
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
  ledger-service:
    <<: *service-defaults
    build: { context: ., dockerfile: ledger-service/Dockerfile }
    container_name: payflow-ledger-service
    ports: ["8088:8088"]
    environment:
      <<: *common-env
      POSTGRES_DB: ledger_db
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
networks:
  payflow:
    driver: bridge
volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
